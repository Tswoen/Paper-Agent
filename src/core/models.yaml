# 可选模型提供商
model-provider:
  - siliconflow
  - openai
  - dashscope
  - ark

# 项目默认使用的模型和嵌入模型配置
# default-model:
#   model-provider: siliconflow
#   model: Qwen/Qwen3-32B
default-model:
  model-provider: ark
  model: doubao-seed-1-6-thinking-250715

default-embedding-model:
  model-provider: dashscope
  model: text-embedding-v4
  dimension: 1024

# embedding-model:
#   model-provider: siliconflow
#   model: Qwen/Qwen3-Embedding-8B
#   dimension: 1024
embedding-model:
  model-provider: dashscope
  model: text-embedding-v4
  dimension: 1024

# 项目模块具体使用的模型配置（可选）
search-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

reading-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

# 兼容旧写作入口的模型键
writing-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

subanalyse-cluster-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

subanalyse-deep-analyse-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

subanalyse-global-analyse-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

subwriting-writing-director-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

subwriting-writing-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

subwriting-retrieval-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-32B

report-model:
  model-provider: ark
  model: doubao-seed-1-6-thinking-250715

# 知识库和聚类相关嵌入模型配置
chroma-embedding-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-Embedding-8B
  dimension: 1024

cluster-embedding-model:
  model-provider: siliconflow
  model: Qwen/Qwen3-Embedding-8B
  dimension: 1024

# 各个模型提供商的API密钥和基础URL
siliconflow:
  api_key: SILICONFLOW_API_KEY
  base_url: https://api.siliconflow.cn/v1

openai:
  api_key: OPENAI_API_KEY
  base_url: https://api.openai.com/v1

dashscope:
  api_key: DASHSCOPE_API_KEY
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1

ark:
  api_key: ARK_API_KEY
  base_url: https://ark.cn-beijing.volces.com/api/v3

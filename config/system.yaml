defaults:
  llm:
    temperature: 0.7
    max_tokens: 4000
    reasoning_effort: none
    context_window_tokens: 64000
  embedding:
    dimensions: 1024
    batch_size: 32

read:
  agent_name: default_agent
  paper_cache_dir: data/paper_cache
  deep_score_threshold: 80
  connect_timeout_seconds: 10
  download_timeout_seconds: 60
  max_file_size_mb: 50
  chunk_size: 1200
  chunk_overlap: 150
  vector_store_path: data/vector_store
  vector_store_collection: papers

# analyse 节点的相关系统配置
analyse:
  agent_name: analyse_agent

write:
